<div class="container">
  <div class="row">
    <div class="col-md-4 content-center mx-auto my-auto">
      <div class="card card-login card-plain">
        <form class="form" method="" action="" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="header header-primary text-center mb-5 ">
            <div class="logo-container">
              <img src="assets/img/final.png" alt="" width="70%">
            </div>
          </div>
          <div class="content">
            <div class="input-group form-group-no-border input-lg" [ngClass]="{'input-group-focus':focus===true}">
              <div class="input-group-prepend">
                <span class="input-group-text"> <i class="fa fa-user"></i></span>
              </div>
              <input type="text" class="form-control" placeholder="Email..." (focus)="focus=true" (blur)="focus=false"
                formControlName="username">
            </div>
            <div class="input-group form-group-no-border input-lg" [ngClass]="{'input-group-focus':focus1===true}">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="fa fa-lock"></i></span>
              </div>
              <input [type]="password" placeholder="Password..." class="form-control form-control-password"
                (focus)="focus1=true" (blur)="focus1=false" formControlName="password" />
              <div class="input-group-append">
                <button type="button" class="input-group-text  pl-3" (click)="onClick()">
                  <i class="fa fa-eye" aria-hidden="true" *ngIf="!show"></i>
                  <i class="fa fa-eye-slash" aria-hidden="true" *ngIf="show"></i>
                </button>
              </div>

            </div>
            <div class="form-check pl-0  ">
              <label class="form-check-label">
                <input [checked]="isRememberMe" (change)="selectRememberMe($event)" class="form-check-input"
                  type="checkbox" data-gtm-form-interact-field-id="1">
                <span class="form-check-sign"></span> Remember me
              </label>
            </div>
          </div>
          <div class="footer text-center">
            <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary btn-round btn-block">Sign
              in</button>

          </div>
        </form>
      </div>
    </div>
  </div>

</div>
